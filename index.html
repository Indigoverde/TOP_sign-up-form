<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="reset.css">
    <link rel="stylesheet" href="style.css">
    <title>Document</title>
</head>
<body>
    <div class="sidebar">
        <!-- <img src="assets/sidebar-img.jpg" alt="Woman standing in a dark place"> -->
        <div class="logo-section">
            <div class="logo-image"><img src="assets/logo.svg" alt="logo"></div>
            <div class="logo-text">ATLANTIS EXP</div>
        </div>
        <div class="footer">Photo by <a href="https://unsplash.com/fr/@chaitanya_nelli">Nelli Chaitanya</a> on <a href="https://unsplash.com/fr">Unsplash</a></div>
    </div>

    <div class="content">
        <div class="headline">
            <p class="hero">Atlantis is back — don’t miss the boat! Sign up now to reserve your spot in history.</p>
            <p class="sub_hero">No mermaids were harmed in the making of this trip. Limited spots available—unless we find more of the city.</p>
        </div>
        <div class="form-section">
            Let's go!
            <form action="example.com/path" method="post">
                <label for="first_name">FIRST NAME *</label>
                <input type="text" name="first_name" id="first_name">
                <label for="last_name">LAST NAME *</label>
                <input type="text" name="last_name" id="last_name">
                <label for="email">EMAIL *</label>
                <input type="email" name="email" id="email">
                <label for="phone_number">PHONE NUMBER</label>
                <input type="tel" name="phone_number" id="phone_number">
                <label for="password">PASSWORD *</label>
                <input type="password" name="password" id="password">
                <label for="confirm_password">CONFIRM PASSWORD *</label>
                <input type="password" name="confirm_password" id="confirm_password">
                <button type="submit">Create account</button>

            </form>
        <div>
            Already have an account? 
            <a href="">Log in</a>
        </div>
        
        </div>
     
    </div>
    
</body>
</html>
